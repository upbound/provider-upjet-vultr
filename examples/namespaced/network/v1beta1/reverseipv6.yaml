apiVersion: network.vultr.m.upbound.io/v1beta1
kind: ReverseIPv6
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta1/reverseipv6
  labels:
    testing.upbound.io/example-name: example-reverseipv6
  name: example-reverseipv6
  namespace: upbound-system
spec:
  forProvider:
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-reverseipv6
    ipSelector:
      matchLabels:
        testing.upbound.io/example-name: example-reverseipv6
    reverse: host-v6.example.com

---

apiVersion: compute.vultr.m.upbound.io/v1beta1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta1/reverseipv6
    uptest.upbound.io/pre-delete-hook: ../testhooks/delete-reverseip.sh
  labels:
    testing.upbound.io/example-name: example-reverseipv6
  name: example-reverseipv6
  namespace: upbound-system
spec:
  forProvider:
    label: example-reverseipv6
    region: ewr
    plan: vc2-1c-1gb
    osId: 2136
    enableIpv6: true
