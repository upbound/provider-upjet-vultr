    meta.upbound.io/example-id: compute/v1beta1/instanceipv4
    uptest.upbound.io/pre-delete-hook: ../testhooks/delete-instanceipv4.sh
  labels:
    testing.upbound.io/example-name: example-instanceipv4
  name: example-instanceipv4
  namespace: upbound-system
spec:
  forProvider:
    label: example-instanceipv4
    region: ewr
    plan: vc2-1c-1gb
    osId: 2136
