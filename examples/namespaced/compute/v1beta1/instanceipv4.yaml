apiVersion: compute.vultr.m.upbound.io/v1beta1
kind: InstanceIPv4
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1beta1/instanceipv4
  labels:
    testing.upbound.io/example-name: example-instanceipv4
  name: example-instanceipv4
  namespace: upbound-system
spec:
  forProvider:
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-instanceipv4
