apiVersion: compute.vultr.m.upbound.io/v1beta1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1beta1/instance
  labels:
    testing.upbound.io/example-name: example-instance
  name: example-instance
  namespace: upbound-system
spec:
  forProvider:
    label: example-instance
    region: ewr
    plan: vc2-1c-1gb
    osId: 2136
    sshKeyIdsSelector:
      matchLabels:
        testing.upbound.io/example-name: example-instance
  writeConnectionSecretToRef:
    name: example-instance-conn

---

apiVersion: compute.vultr.m.upbound.io/v1beta1
kind: SSHKey
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1beta1/instance
  labels:
    testing.upbound.io/example-name: example-instance
  name: example-instance
  namespace: upbound-system
spec:
  forProvider:
    name: example-instance
    sshKey: ssh-rsa  example@uptest
