apiVersion: compute.vultr.m.upbound.io/v1beta1
kind: SSHKey
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1beta1/sshkey
  labels:
    testing.upbound.io/example-name: example-key
  name: example-key
  namespace: upbound-system
spec:
  forProvider:
    name: example-key
    sshKey: ssh-rsa  example@uptest
