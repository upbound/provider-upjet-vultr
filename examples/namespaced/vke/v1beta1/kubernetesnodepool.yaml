apiVersion: vke.vultr.m.upbound.io/v1beta1
kind: KubernetesNodePool
metadata:
  annotations:
    meta.upbound.io/example-id: vke/v1beta1/kubernetesnodepool
    uptest.upbound.io/timeout: "1800"
  labels:
    testing.upbound.io/example-name: example-vke-nodepool
  name: example-vke-nodepool
  namespace: upbound-system
spec:
  forProvider:
    clusterIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-vke-nodepool
    label: example-vke-nodepool
    plan: vc2-1c-2gb
    nodeQuantity: 1
    vpcOnly: false

---

apiVersion: vke.vultr.m.upbound.io/v1beta1
kind: Kubernetes
metadata:
  annotations:
    meta.upbound.io/example-id: vke/v1beta1/kubernetesnodepool
  labels:
    testing.upbound.io/example-name: example-vke-nodepool
  name: example-vke-nodepool
  namespace: upbound-system
spec:
  forProvider:
    label: example-vke-nodepool
    region: ewr
    version: v1.37.2+1
    nodePools:
      label: example-vke-pool
      plan: vc2-1c-2gb
      nodeQuantity: 1
