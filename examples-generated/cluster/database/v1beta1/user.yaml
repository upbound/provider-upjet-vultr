apiVersion: database.vultr.upbound.io/v1beta1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: database/v1beta1/user
  labels:
    testing.upbound.io/example-name: my_database_user
  name: my-database-user
spec:
  forProvider:
    databaseIdSelector:
      matchLabels:
        testing.upbound.io/example-name: my_database
    passwordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    username: my_database_user
