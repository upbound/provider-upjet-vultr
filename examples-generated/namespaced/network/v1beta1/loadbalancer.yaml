apiVersion: network.vultr.m.upbound.io/v1beta1
kind: LoadBalancer
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta1/loadbalancer
  labels:
    testing.upbound.io/example-name: lb
  name: lb
  namespace: upbound-system
spec:
  forProvider:
    balancingAlgorithm: roundrobin
    forwardingRules:
    - backendPort: 81
      backendProtocol: http
      frontendPort: 82
      frontendProtocol: http
    healthCheck:
    - checkInterval: 3
      healthyThreshold: 4
      path: /test
      port: 8080
      protocol: http
      responseTimeout: 1
      unhealthyThreshold: 2
    label: vultr-load-balancer
    nodes: 3
    region: ewr
