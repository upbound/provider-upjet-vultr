apiVersion: database.vultr.m.upbound.io/v1beta1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: database/v1beta1/user
  labels:
    testing.upbound.io/example-name: my_database_user
  name: my-database-user
  namespace: upbound-system
spec:
  forProvider:
    databaseIdSelector:
      matchLabels:
        testing.upbound.io/example-name: my_database
    passwordSecretRef:
      key: example-key
      name: example-secret
    username: my_database_user
